<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار API Versioning</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: inline-block; width: 400px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; margin: 10px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        pre { background: #eee; padding: 10px; border-radius: 5px; text-align: left; direction: ltr; }
    </style>
</head>
<body>

    <div class="container">
        <h2>نظام إصدارات الـ API</h2>
        <button onclick="fetchApi('v1')">جلب بيانات الإصدار V1</button>
        <button onclick="fetchApi('v2')">جلب بيانات الإصدار V2</button>
        
        <h3>النتيجة:</h3>
        <pre id="result">اضغط على أحد الأزرار بالأعلى...</pre>
    </div>

    <script>
        async function fetchApi(version) {
            const url = `/api/${version}/products`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById('result').innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').innerText = "حدث خطأ أثناء جلب البيانات: " + error;
            }
        }
    </script>

</body>
</html>
